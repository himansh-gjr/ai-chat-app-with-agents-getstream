# render.yaml at repo root
services:
  - type: web
    name: ai-chat-backend
    runtime: node
    rootDir: nodejs-ai-assistant
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: FRONTEND_URL
        value: https://ai-chat-frontend-by4d.onrender.com
    envVarGroups:
      - shared-secrets

  - type: web
    name: ai-chat-frontend
    runtime: static
    rootDir: react-stream-ai-assistant
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_BACKEND_URL
        value: https://ai-chat-backend-hxcr.onrender.com
      - key: VITE_STREAM_API_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

envVarGroups:
  - name: shared-secrets
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: STREAM_API_KEY
        sync: false
      - key: STREAM_API_SECRET
        sync: false
      - key: TAVILY_API_KEY
        sync: false